<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>크레이지 아케이드</title>
  </head>
  <body>
    <div id="app">
      <h1>💣 크레이지 아케이드</h1>
      <p class="help">
        <span class="p1">1P: WASD + Space/F</span>
        &nbsp;·&nbsp;
        <span class="p2">2P: 방향키 + Enter</span>
        &nbsp;·&nbsp; P 일시정지 · R 재시작 · M 음소거
      </p>
      <p class="help touch-only">
        📱 모바일: 왼쪽 패드 = 1P, 오른쪽 패드 = 2P(대전) · 💣 버튼으로 물풍선
      </p>
      <div id="hud"></div>
      <div id="stageWrap">
        <canvas id="game" width="600" height="520"></canvas>
        <div id="menu">
          <div class="menu-card">
            <h2>💣 크레이지 아케이드</h2>
            <p>모드를 선택하세요</p>
            <button id="soloBtn" type="button">🙋 1P 스테이지 (적 처치)</button>
            <button id="battleBtn" type="button">⚔️ 2P 대전 (같은 기기)</button>
            <button type="button" disabled title="서버 없이 동작하는 정적 페이지라 온라인은 아직 지원하지 않아요">
              🌐 온라인 대전 (준비중)
            </button>
            <p class="menu-help">
              PC: 1P WASD+Space · 2P 방향키+Enter<br />
              모바일: 하단 터치 패드 · 🎈💧⚡ 아이템을 모아보세요!
            </p>
          </div>
        </div>
      </div>
      <div id="controls">
        <button id="restartBtn" type="button">↻ 재시작 (R)</button>
        <button id="pauseBtn" type="button">⏸ 일시정지 (P)</button>
        <button id="menuBtn" type="button">🏠 메뉴</button>
        <button id="muteBtn" type="button">🔊 소리 끄기</button>
      </div>

      <div id="touch">
        <div class="pad" data-player="1">
          <div class="pad-title p1">1P</div>
          <div class="dpad">
            <button type="button" data-dir="up" aria-label="1P 위">▲</button>
            <button type="button" data-dir="left" aria-label="1P 왼쪽">◀</button>
            <button type="button" data-dir="down" aria-label="1P 아래">▼</button>
            <button type="button" data-dir="right" aria-label="1P 오른쪽">▶</button>
          </div>
          <button type="button" class="bombBtn" data-bomb="1">💣</button>
        </div>
        <div class="pad" data-player="2">
          <div class="pad-title p2">2P</div>
          <div class="dpad">
            <button type="button" data-dir="up" aria-label="2P 위">▲</button>
            <button type="button" data-dir="left" aria-label="2P 왼쪽">◀</button>
            <button type="button" data-dir="down" aria-label="2P 아래">▼</button>
            <button type="button" data-dir="right" aria-label="2P 오른쪽">▶</button>
          </div>
          <button type="button" class="bombBtn" data-bomb="2">💣</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
